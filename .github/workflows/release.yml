name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # for git tags and GitHub Releases
      pull-requests: write  # for creating/updating the Version Packages PR
      id-token: write       # for npm provenance attestations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve published version
        id: ver
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create git tags
        if: steps.changesets.outputs.published == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          git tag -f "v$V"
          git tag -f "lh--v$V"
          git push origin "v$V" "lh--v$V"

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/extract-changelog-entry.mjs "$V" > /tmp/notes.md
          gh release create "v$V" --title "v$V" --notes-file /tmp/notes.md --verify-tag

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
