# LeanHarness configuration
# Source of truth for project-wide harness behavior.

version: "0.1"

project:
  name: auto                  # auto-detect from git remote or package.json
  mode: brownfield-first      # assume existing codebase; discover, don't scaffold

host:
  primary: claude-code
  adapter: claude-cli

# Visible workflow: Specify -> Discover -> Build -> Check
workflow:
  visible_steps:
    - specify
    - discover
    - build
    - check
  one_command: do             # single entry point that walks all steps
  require_worktree: false     # git worktree per feature (off by default)
  require_review: true        # human review before marking done
  require_verification: true  # verification evidence required before done

artifacts:
  root: .lh
  features_dir: .lh/features
  templates_dir: .lh/templates
  memory_dir: .lh/memory
  event_log: events.jsonl     # per-feature event stream
  cavebus_log: cavebus.log    # per-feature compressed agent messages

# On-demand discovery: only touch code relevant to active feature
discovery:
  strategy: on-demand
  default_depth: D2           # D0=file, D1=imports, D2=transitive, D3=full-module
  max_initial_files: 25       # cap first-pass discovery
  escalate_on:                # trigger deeper discovery or human review
    - auth
    - payments
    - database_migration
    - security
    - no_tests_found
    - unclear_owner

# Bounded context: compile only what each task needs
context:
  bounded_context: true
  compile_per_task: true
  include_full_repo_map: false

# CaveBus compression for agent-to-agent messages
compression:
  enabled: true
  protocol: cavebus
  mode: full                  # full = maximally compressed; lite = readable shorthand

# Verification: what counts as "done"
verification:
  require_acceptance_trace: true   # each acceptance criterion traced to evidence
  require_changed_files: true      # at least one file changed
  require_review: true             # human sign-off

# Risk gates: require explicit approval before proceeding
risk_gates:
  require_approval:
    - destructive_migration
    - auth_rewrite
    - payment_logic
    - new_dependency
    - public_api_break
    - broad_refactor
    - security_sensitive_change

# Memory: local, feature-scoped
memory:
  store: local                # local files only
  scope: feature              # scoped to active feature by default
  project_file: .lh/memory/project.md
  decisions_file: .lh/memory/decisions.md
  patterns_file: .lh/memory/patterns.md
  cave_file: .lh/memory/cave.md

# Logging
logging:
  event_format: jsonl
  write_events: true
  write_cavebus: true
  log_level: info

# Adapters: host-specific integration points
adapters:
  claude-cli:
    skills_dir: .claude/skills
    hooks_enabled: true
    settings_file: .claude/settings.json

# Code graph index for import-aware discovery and cross-feature knowledge
graph:
  enabled: true
  index_path: .lh/graph           # where import-graph.json and symbol-graph.json live
  auto_update: true               # update graph automatically before discovery runs
