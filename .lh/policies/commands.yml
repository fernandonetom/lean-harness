# LeanHarness command classification policy
# Classifies Bash commands for hook guardrails.

version: "0.1"
name: command-policy
purpose: classify Bash commands for LeanHarness guardrails

deny:
  - pattern: "rm -rf /"
    reason: "Refuses to delete filesystem root."
  - pattern: "rm -rf /*"
    reason: "Refuses to delete filesystem root contents."
  - pattern: "rm -rf ~"
    reason: "Refuses to delete the home directory."
  - pattern: "rm -rf ~/*"
    reason: "Refuses to delete home directory contents."
  - pattern: "rm -rf .git"
    reason: "Refuses to delete git metadata."
  - pattern: "rm -rf .git/"
    reason: "Refuses to delete git metadata."
  - pattern: "git push --force*"
    reason: "Force push requires explicit manual control."
  - pattern: "git push -f *"
    reason: "Force push requires explicit manual control."
  - pattern: "git reset --hard*"
    reason: "Hard reset can destroy local work."
  - pattern: "git clean -fd*"
    reason: "Git clean with force can delete untracked work."
  - pattern: "git clean -fx*"
    reason: "Git clean with force can delete untracked work."
  - pattern: "git clean -fxd*"
    reason: "Git clean with force can delete untracked work."
  - pattern: "*DROP DATABASE*"
    reason: "Destructive database command."
  - pattern: "*drop database*"
    reason: "Destructive database command."
  - pattern: "*DROP TABLE*"
    reason: "Destructive database command."
  - pattern: "*drop table*"
    reason: "Destructive database command."
  - pattern: "cat .env*"
    reason: "Refuses to expose secrets."
  - pattern: "printenv*"
    reason: "Refuses to expose environment secrets."
  - pattern: "env"
    reason: "Refuses to expose environment secrets."
  - pattern: "*> /dev/sd*"
    reason: "Refuses to write directly to block devices."
  - pattern: "dd if=*"
    reason: "Refuses raw disk writes."
  - pattern: "mkfs*"
    reason: "Refuses filesystem creation on devices."
  - pattern: ":(){ :|:& };:*"
    reason: "Refuses fork bombs."

ask:
  - pattern: "npm install*"
    reason: "Dependency installation requires approval."
  - pattern: "npm update*"
    reason: "Dependency updates require approval."
  - pattern: "npm ci*"
    reason: "Dependency installation requires approval."
  - pattern: "pnpm add*"
    reason: "Dependency installation requires approval."
  - pattern: "pnpm update*"
    reason: "Dependency updates require approval."
  - pattern: "pnpm install*"
    reason: "Dependency installation requires approval."
  - pattern: "yarn add*"
    reason: "Dependency installation requires approval."
  - pattern: "yarn install*"
    reason: "Dependency installation requires approval."
  - pattern: "bun add*"
    reason: "Dependency installation requires approval."
  - pattern: "bun install*"
    reason: "Dependency installation requires approval."
  - pattern: "pip install*"
    reason: "Dependency installation requires approval."
  - pattern: "poetry add*"
    reason: "Dependency installation requires approval."
  - pattern: "cargo add*"
    reason: "Dependency installation requires approval."
  - pattern: "git push*"
    reason: "Pushing changes requires approval."
  - pattern: "git reset*"
    reason: "Resetting git state requires approval."
  - pattern: "git clean*"
    reason: "Cleaning git state requires approval."
  - pattern: "*migrate reset*"
    reason: "Migration reset requires approval."
  - pattern: "*db reset*"
    reason: "Database reset requires approval."
  - pattern: "*deploy*"
    reason: "Deployment requires approval."
  - pattern: "*curl*|*sh*"
    reason: "Piping remote scripts requires approval."
  - pattern: "rm -r*"
    reason: "Recursive deletion requires approval."

safe_read_only:
  - "git status*"
  - "git diff*"
  - "git log*"
  - "git branch*"
  - "git show*"
  - "git blame*"
  - "ls*"
  - "find*"
  - "grep*"
  - "rg*"
  - "cat README.md"
  - "sed -n*"
  - "wc *"
  - "head *"
  - "tail *"

safe_verification:
  - "npm test*"
  - "npm run test*"
  - "npm run lint*"
  - "npm run typecheck*"
  - "pnpm test*"
  - "pnpm lint*"
  - "pnpm typecheck*"
  - "pnpm run test*"
  - "pnpm run lint*"
  - "yarn test*"
  - "yarn lint*"
  - "bun test*"
  - "pytest*"
  - "go test*"
  - "cargo test*"
  - "node --check*"
  - "python -m json.tool*"
  - "python -c *"
